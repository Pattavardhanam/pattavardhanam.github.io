        highlights:
          - Characterized CMOS inverters in TSMC 180nm (Cadence Virtuoso/Spectre) across 20 PVT corners; extracted gain, bandwidth, and switching metrics
          - Executed full-custom layout (Layout XL), Calibre DRC/LVS, and post-layout parasitic extraction (PEX), validating performance across TT/FF/SS corners on schematic and extracted views
          - "FinFET benchmarking study: designed and simulated ring oscillators, FO4 inverters, and opamps using 14nm High Performance PTM models; compared propagation delay and drive strength across technology nodes from 7nm to 20nm"
          - Designed a custom 2-layer breakout PCB for a taped-out chip using Cadence Allegro X Design Platform

      - company: MARVEL UVCE, R&D Lab
        position: Coordinator Design & Prototyping | Co-Lead Product Development | VLSI group (Analog)
        location: Bengaluru, India
