        end_date: present
        highlights:
          - Mentored student electronics designs involving PCB, FPGA, and signal processing
          - Co-leading product development cohort focusing on end-to-end hardware solutions
          - Co-developed the VLSI syllabus to teach the next generation of VLSI enthusiasts, with a personal focus on analog VLSI

      - company: IISc, Dept. of Aerospace Engineering (Project Urdhyuth)
        position: Research Intern – Team Lead (Avionics)
        location: Bengaluru, India
        start_date: 2025-07
        end_date: 2026-06
        summary: Non-Linear Multifunctional Composites Analysis and Design Lab. Guided by Prof. Dineshkumar Harursampath (IISc) and Prof. Ramesh Gupta (NITTR-Bhopal).
        highlights:
          - Developed a Power Management System in MATLAB involving load modeling, protection logic, and subsystem interface definition for an eVTOL platform
          - Co-designed Li-Ion NMC battery architecture and implemented Battery Management System functions for monitoring, balancing, and safety protection

    Projects:
      - name: Fully Analog MPPT Controller Tapeout — SKY130A PDK (In Progress)
        summary: All-analog perturb-and-observe MPPT controller for CubeSat applications, targeting Tiny Tapeout.
        highlights:
          - Chose a fully analog P&O architecture over RCC, centered on a Gilbert cell multiplier core, with sample-and-hold and StrongARM comparator blocks built for IP reuse
        start_date: 2026

      - name: Low-Cost Open-Source Maskless Photolithography System (In Progress)
        summary: Maskless lithography using a DLP2000 DMD as a reconfigurable UV photomask on a Creality CR-10S motion platform.
        highlights:
          - Coaxial focus/exposure path for live focus verification, targeting ~10 µm resolution
          - Scoping a ~20-week build across procurement, integration, calibration, and open-source documentation/release
        start_date: 2026

      - name: HeartGuard — ECG Anomaly Detection Device
        summary: Real-time arrhythmia detection device with custom analog front-end and wireless streaming.
        highlights:
          - Designed analog front-end using TI ADS1298 (8-channel, 24-bit ECG AFE) with custom signal conditioning
          - Custom 4-layer PCB in Altium integrating ADS1298, STM32F411 (Cortex-M4), and BLE module
        start_date: 2024

      - name: Hardware-Aware Spectrum Monitoring with Jammer-like Anomaly Detection (CMOS Role)
        summary: Passive spectrum sensing platform for real-time channel occupancy and interference analysis.
        highlights:
          - Transistor-level StrongARM latch comparator in Xschem/Ngspice achieving ~6–7 mV sensitivity and ~10 ns decision time
          - Validated across noise-only, signal-present, and jammer conditions; analyzed metastability, detection margins, and transition dynamics
        start_date: 2024

      - name: Hardware Trojan Detection
        summary: RTL-level trojan injection and side-channel detection pipeline.
        highlights:
          - Injected RTL-level trojans in Verilog; 70,000 cycles of fixed-seed constrained-random stimulus to detect output divergence between clean and trojan ALU variants
          - Python-based side-channel detection pipeline using switching activity signatures
        start_date: 2024

      - name: CanSat (Can-Sized Satellite) — Power Subsystem Lead
        summary: Dual-board avionics architecture around a 2S Li-ion pack with TPS563203 buck converters.
        highlights:
          - Full power budget (load analysis, battery draw with conversion losses, energy balance) with 79% margin
          - INA219-based current monitoring across all rails
        start_date: 2024

